name: Release

# Runs on every push to main. When changesets are pending, the changesets
# action opens (or updates) a "Version Packages" PR; merging that PR consumes
# the changesets, publishes to npm, and creates the git tag + GitHub Release.
# Pushes with no pending changesets are no-ops.
#
# Publishing uses npm trusted publishing (OIDC) — no npm token is stored in
# repo secrets. The trusted publisher must be configured on npmjs.com
# (package Settings → Trusted Publishing) for: repository knorby/
# inkeedecoder-client, workflow filename release.yml, environment release.
# npm CLI >= 11.5 is required for OIDC (Node 22 bundles npm 10.x, hence the
# global upgrade below). Provenance additionally requires a public repo.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
