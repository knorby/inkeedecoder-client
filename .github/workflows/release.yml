name: Release

# Runs on every push to main. When changesets are pending, the changesets
# action opens (or updates) a "Version Packages" PR; merging that PR consumes
# the changesets, publishes to npm with provenance, and creates the git tag +
# GitHub Release. Pushes with no pending changesets are no-ops.
#
# Requires the NPM_TOKEN repo secret (granular token with publish permission)
# and a public repository for npm provenance attestation.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
