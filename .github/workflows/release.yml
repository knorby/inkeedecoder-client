name: Release

# Runs on every push to main. When changesets are pending, the changesets
# action opens (or updates) a "Version Packages" PR; merging that PR consumes
# the changesets, publishes to npm, and creates the git tag + GitHub Release.
# Pushes with no pending changesets are no-ops.
#
# Publishing uses npm trusted publishing (OIDC) — no npm token is stored in
# repo secrets. The trusted publisher must be configured on npmjs.com
# (package Settings → Trusted Publishing) for: repository knorby/
# inkeedecoder-client, workflow filename release.yml, environment release.
# npm CLI >= 11.5.1 is required for OIDC. This job pins Node 24 (bundled npm
# is 11.x) and still upgrades npm globally as a belt-and-braces measure, then
# fails fast if the resolved npm is too old. The .nvmrc Node version continues
# to apply to dev/CI tests. Provenance additionally requires a public repo.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          # Node 24 bundles npm 11.x (trusted publishing needs npm >= 11.5.1;
          # Node 22 from .nvmrc bundles npm 10.x, which cannot do OIDC).
          node-version: 24
          cache: npm
      - run: npm install -g npm@latest
      - name: Verify npm supports trusted publishing
        run: |
          npm --version
          node -e "const [a,b]=process.argv[1].split('.').map(Number); if (a<11 || (a===11 && b<5)) { console.error('npm ' + process.argv[1] + ' is too old for trusted publishing (needs >= 11.5.1)'); process.exit(1); }" "$(npm --version)"
      - run: npm ci
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
