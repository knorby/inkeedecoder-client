# Socket repository configuration.
#
# Acknowledges residual dependency alerts that persist in any CSS-selector-
# based HTML parsing stack after the cheerio removal (see AGENTS.md
# "Dependency conventions"). These alert types are informational and were
# reviewed as accepted risk; disabling them here keeps repo scans focused on
# actionable findings. New alert types still surface normally.
#
# Note: this config affects Socket's scans of this repository (GitHub app /
# CI). It does not change what the public package page on socket.dev shows.
issueRules:
  # domutils@3.x references globalThis.fetch in its bundled RSS-feed helper
  # (lib/feeds.js). Dead code for our usage; no network access occurs.
  networkAccess: false
  # boolbase (css-select dependency) is a 7-line predicate library.
  trivialPackage: false
  # entities ships generated character-decode tables that trip minification
  # heuristics; upstream source is readable and unobfuscated.
  minifiedFile: false
  # AI-flagged "anomaly" in css-select's pseudo-selector engine (confidence
  # 0.65); the analysis itself concludes the code is a legitimate selector
  # implementation.
  gptAnomaly: false
  # Benign GitHub source links embedded in comments across fb55/domhandler
  # ecosystem packages.
  urlStrings: false
